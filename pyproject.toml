[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "ine_health_data"
version = "0.0.2"
description = "Project dedicated to understand the usage of Spain's INE health data, and perform basic dhealth dataSci analysis"
authors = [
  { name = "LoloCG" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = ">=3.10.0"


[tool.ruff]
line-length = 99
src = ["ine_health_data"]
include = ["pyproject.toml", "ine_health_data/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["ine_health_data"]
force-sort-within-sections = true

